<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply — Tamil School of Cinematic Arts</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="apply-page">

    <header class="apply-header">

        <a href="/" class="back-link">
            ← Back to School
        </a>

        <div class="school-logo">
            TAMIL SCHOOL
            <span>OF CINEMATIC ARTS</span>
        </div>

    </header>


    <main class="application-container">

        <div class="application-intro">

            <span class="eyebrow">
                BEGIN YOUR JOURNEY
            </span>

            <h1>
                Your story
                <em>starts here.</em>
            </h1>

            <p>
                Tell us a little about yourself and the cinematic
                discipline you want to explore.
            </p>

        </div>


        <form class="application-form">

            <div class="form-row">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text"
                           name="name"
                           placeholder="Your name"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           placeholder="you@example.com"
                           required>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel"
                           name="phone"
                           placeholder="Your phone number"
                           required>
                </div>

                <div class="form-group">

                    <label>Discipline</label>

                    <select name="discipline" required>

                        <option value="">
                            Select a discipline
                        </option>

                        <option>Direction</option>
                        <option>Cinematography</option>
                        <option>Screenwriting</option>
                        <option>Acting</option>
                        <option>Editing</option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Why do you want to learn cinema?
                </label>

                <textarea
                    name="message"
                    rows="6"
                    placeholder="Tell us about yourself..."
                    required></textarea>

            </div>


            <button type="submit" class="application-submit">
                SUBMIT APPLICATION
                <span>↗</span>
            </button>

        </form>

    </main>

</body>
</html>
